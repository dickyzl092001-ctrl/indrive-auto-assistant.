
name: Build inDrive APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

            - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          packages: "platform-tools,platforms;android-35,build-tools;35.0.0"
          accept-android-sdk-licenses: true

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q *.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/IndriveAutoAssistant_AutoAccept
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: inDrive-AutoAssistant-APK
          path: extracted/IndriveAutoAssistant_AutoAccept/app/build/outputs/apk/debug/app-debug.apk
